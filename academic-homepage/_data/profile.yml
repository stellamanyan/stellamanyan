short_bio: >-
  <p>
    I'm an undergraduate at Columbia University double majoring in Astrophysics and German Literature & Culture,
    with a minor in Mathematics. My research interests are centered on instrumentation, optical design, and
    observational astronomy &mdash; I'm especially drawn to building and operating the hardware that makes
    discovery possible.
  </p>
  <p>
    I've spent the past few summers designing optomechanical camera systems for robotic telescopes, upgrading
    a campus observatory, and doing remote and in-person observing at facilities from Kitt Peak to Maunakea.
    My long-term goal is a career in astro-instrumentation, building and operating the next generation of
    telescopes.
  </p>

